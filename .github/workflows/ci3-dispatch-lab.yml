name: CI3 Dispatch Lab

on:
  pull_request:
    paths:
      - ".github/workflows/ci3-dispatch-lab.yml"
      - "Tools/CI3DispatchLab/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ci3-dispatch-lab.yml"
      - "Tools/CI3DispatchLab/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-benchmark:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 GCC
            slug: linux-x64-gcc
            runner: ubuntu-24.04
            cxx: g++
          - name: Linux x64 Clang
            slug: linux-x64-clang
            runner: ubuntu-24.04
            cxx: clang++
          - name: Linux ARM64 GCC
            slug: linux-arm64-gcc
            runner: ubuntu-24.04-arm
            cxx: g++
          - name: Linux ARM64 Clang
            slug: linux-arm64-clang
            runner: ubuntu-24.04-arm
            cxx: clang++
          - name: macOS ARM64 AppleClang
            slug: macos-arm64-appleclang
            runner: macos-15
            cxx: clang++

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Record environment
        shell: bash
        run: |
          mkdir -p "results/${{ matrix.slug }}/diagnostics"
          {
            uname -a
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            "${{ matrix.cxx }}" --version
            cmake --version
            python3 --version
          } | tee "results/${{ matrix.slug }}/environment.txt"

      - name: Configure
        shell: bash
        run: |
          cmake \
            -S Tools/CI3DispatchLab \
            -B build/ci3-dispatch-lab \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}"

      - name: Build
        run: cmake --build build/ci3-dispatch-lab --parallel

      - name: Verify equivalence
        shell: bash
        run: |
          ctest --test-dir build/ci3-dispatch-lab --output-on-failure \
            | tee "results/${{ matrix.slug }}/ctest.txt"

      - name: Run dispatch matrix
        shell: bash
        run: |
          python3 Tools/CI3DispatchLab/run_matrix.py \
            --binary build/ci3-dispatch-lab/ci3_dispatch_lab \
            --output-dir "results/${{ matrix.slug }}/dispatch" \
            --baseline-engine callback-two-level \
            --target-ops 2000000 \
            --repetitions 7

      - name: Run state-materialization matrix
        shell: bash
        run: |
          python3 Tools/CI3DispatchLab/run_matrix.py \
            --binary build/ci3-dispatch-lab/ci3_state_lab \
            --output-dir "results/${{ matrix.slug }}/state" \
            --baseline-engine state-promotable \
            --target-ops 2000000 \
            --repetitions 7

      - name: Capture binary diagnostics
        shell: bash
        run: |
          diagnostic_dir="results/${{ matrix.slug }}/diagnostics"
          size build/ci3-dispatch-lab/ci3_dispatch_lab \
               build/ci3-dispatch-lab/ci3_state_lab \
            > "${diagnostic_dir}/size.txt"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            nm -nm build/ci3-dispatch-lab/ci3_dispatch_lab \
              > "${diagnostic_dir}/dispatch-nm.txt"
            nm -nm build/ci3-dispatch-lab/ci3_state_lab \
              > "${diagnostic_dir}/state-nm.txt"
            otool -tvV build/ci3-dispatch-lab/ci3_dispatch_lab \
              > "${diagnostic_dir}/dispatch-assembly.txt"
            otool -tvV build/ci3-dispatch-lab/ci3_state_lab \
              > "${diagnostic_dir}/state-assembly.txt"
          else
            nm -S -C --size-sort build/ci3-dispatch-lab/ci3_dispatch_lab \
              > "${diagnostic_dir}/dispatch-nm.txt"
            nm -S -C --size-sort build/ci3-dispatch-lab/ci3_state_lab \
              > "${diagnostic_dir}/state-nm.txt"
            objdump -d -C build/ci3-dispatch-lab/ci3_dispatch_lab \
              > "${diagnostic_dir}/dispatch-assembly.txt"
            objdump -d -C build/ci3-dispatch-lab/ci3_state_lab \
              > "${diagnostic_dir}/state-assembly.txt"
          fi

      - name: Upload raw results and diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: ci3-dispatch-lab-v2-${{ matrix.slug }}
          path: results/${{ matrix.slug }}
          if-no-files-found: error
