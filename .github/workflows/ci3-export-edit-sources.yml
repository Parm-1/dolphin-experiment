name: CI3 Export Edit Sources

on:
  push:
    branches:
      - ci3/block-profile-v1
    paths:
      - ".github/workflows/ci3-export-edit-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Upload files needed for the stacked experiment
        uses: actions/upload-artifact@v7
        with:
          name: ci3-block-profile-edit-sources
          path: |
            .github/workflows/ci3-powerpc-differential.yml
            Source/Core/Core/PowerPC/CachedInterpreter/CachedInterpreter.cpp
            Source/Core/Core/PowerPC/CachedInterpreter/CachedInterpreter.h
            Source/UnitTests/Core/CMakeLists.txt
          if-no-files-found: error
          retention-days: 1
