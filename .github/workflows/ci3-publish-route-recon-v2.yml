name: CI3 Publish Route Reconnaissance v2

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/ci3-publish-route-recon-v2.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v7
        with:
          ref: ci3/exp005-route-recon-v2
          fetch-depth: 0

      - name: Download exact passing artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9320322911/zip" \
            --output /tmp/ci3-route-v2.zip
          printf '%s  %s\n' \
            'c98bc4432ae5f7b18b35922a9c6d2f052b5c14128ff4f3df9ad0bb4d3ebf0692' \
            '/tmp/ci3-route-v2.zip' | sha256sum --check
          mkdir /tmp/ci3-route-v2
          unzip -q /tmp/ci3-route-v2.zip -d /tmp/ci3-route-v2

      - name: Validate bounded passing evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import pathlib
          import re

          root = pathlib.Path('/tmp/ci3-route-v2')
          result_path = root / 'route-recon-v2.json'
          summary_path = root / 'route-recon-v2.md'
          manifest_path = root / 'route-recon-v2-manifest.json'
          for path in (result_path, summary_path, manifest_path):
              if not path.is_file():
                  raise SystemExit(f'missing passing artifact file: {path.name}')

          result = json.loads(result_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          expected_classes = [
              'floating_paired', 'gpu_pipeline', 'integer_control', 'memory_system'
          ]
          if result['schema_version'] != 3:
              raise SystemExit('unexpected result schema')
          if result['github_actions_run_id'] != 32124068535:
              raise SystemExit('unexpected workflow run')
          if result['dolphin_commit'] != '01faa904e1caff3195b2d8185416c9d8f43479b1':
              raise SystemExit('unexpected tested merge ref')
          if result['gate_passed'] is not True:
              raise SystemExit('route gate did not pass')
          if result['qualified_candidate_count'] != 8:
              raise SystemExit('unexpected qualified candidate count')
          if result['qualified_workload_classes'] != expected_classes:
              raise SystemExit('unexpected qualified workload classes')
          if any(item['route_recon_verdict'] != 'ROUTE_CANDIDATE' for item in result['candidates']):
              raise SystemExit('not every candidate qualified')
          invalidated = [item['run_id'] for item in result['invalidated_workflow_runs']]
          if invalidated != [32117017451, 32119465079, 32121448667]:
              raise SystemExit('invalidated-run record changed')

          def sha256(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          if manifest['github_actions_run_id'] != 32124068535 or manifest['gate_passed'] is not True:
              raise SystemExit('manifest does not identify the passing run')
          if manifest['route_result_sha256'] != sha256(result_path):
              raise SystemExit('route result hash mismatch')
          if manifest['route_summary_sha256'] != sha256(summary_path):
              raise SystemExit('route summary hash mismatch')

          durable_text = result_path.read_text() + '\n' + summary_path.read_text()
          prohibited = (
              r'/home/', r'/tmp/', r'guest_address', r'instruction_word',
              r'instruction_bytes', r'disassembly', r'ordered_trace', r'title_id',
              r'user_identifier', r'private key',
          )
          for pattern in prohibited:
              if re.search(pattern, durable_text, flags=re.IGNORECASE):
                  raise SystemExit(f'prohibited durable field or path: {pattern}')
          print('passing route evidence validated')
          PY

      - name: Publish exact evidence and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          destination='docs/ci3/experiments/EXP-20260817-005'
          cp /tmp/ci3-route-v2/route-recon-v2.json "$destination/route-recon-v2.json"
          cp /tmp/ci3-route-v2/route-recon-v2.md "$destination/route-recon-v2.md"
          cp /tmp/ci3-route-v2/route-recon-v2-manifest.json \
            "$destination/route-recon-v2-manifest.json"
          rm .github/workflows/ci3-exp005-route-recon-v2.yml
          rm .github/workflows/ci3-publish-route-recon-v2.yml

          git diff --check
          python3 - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/ci3-exp005-route-recon-v2.yml',
              '.github/workflows/ci3-publish-route-recon-v2.yml',
              'docs/ci3/experiments/EXP-20260817-005/route-recon-v2.json',
              'docs/ci3/experiments/EXP-20260817-005/route-recon-v2.md',
              'docs/ci3/experiments/EXP-20260817-005/route-recon-v2-manifest.json',
          }
          output = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True)
          actual = {line[3:] for line in output.splitlines() if line}
          if actual != expected:
              raise SystemExit(f'unexpected publication scope: {sorted(actual ^ expected)}')
          print(output, end='')
          PY

          git config user.name 'Parm-1'
          git config user.email '75600769+Parm-1@users.noreply.github.com'
          git add -A -- \
            .github/workflows/ci3-exp005-route-recon-v2.yml \
            .github/workflows/ci3-publish-route-recon-v2.yml \
            "$destination/route-recon-v2.json" \
            "$destination/route-recon-v2.md" \
            "$destination/route-recon-v2-manifest.json"
          git commit \
            -m 'CI3: preserve passing route reconnaissance evidence' \
            -m 'Publish the exact bounded files from successful run 32124068535 and remove the temporary execution and publication workflows. The result qualifies eight repeatable launch/stop routes across four classes but makes no architectural, coverage, or performance claim.'
          git push origin HEAD:ci3/exp005-route-recon-v2
