name: CI3 Query Actions Runs

on:
  push:
    branches:
      - master
    paths:
      - ".ci3/actions-query.json"

permissions:
  actions: read
  contents: write

jobs:
  query:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Query repository workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          request = json.loads(Path('.ci3/actions-query.json').read_text(encoding='utf-8'))
          branch = request['branch']
          workflow = request.get('workflow')
          query = urllib.parse.urlencode({'branch': branch, 'per_page': 50})
          if workflow:
              endpoint = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/{urllib.parse.quote(workflow, safe='')}/runs?{query}"
          else:
              endpoint = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?{query}"
          req = urllib.request.Request(endpoint, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ci3-actions-query',
          })
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          runs = []
          for run in payload.get('workflow_runs', []):
              runs.append({
                  'id': run['id'],
                  'name': run['name'],
                  'event': run['event'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'head_branch': run['head_branch'],
                  'head_sha': run['head_sha'],
                  'run_number': run['run_number'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
                  'html_url': run['html_url'],
              })
          result = {'request': request, 'query_run_id': int(os.environ['GITHUB_RUN_ID']), 'runs': runs}
          Path('.ci3/actions-query-result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'Parm-1'
          git config user.email '75600769+Parm-1@users.noreply.github.com'
          git add .ci3/actions-query-result.json
          git commit -m 'CI3: record Actions run query'
          git push origin HEAD:master
