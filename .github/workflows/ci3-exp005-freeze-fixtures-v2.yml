name: CI3 EXP-005 Fixture Freeze v2

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/ci3-exp005-freeze-fixtures-v2.yml"
      - "Tools/ci3/exp005/freeze_fixture_manifest.py"
      - "docs/ci3/experiments/EXP-20260817-005/fixture-manifest-v2.json"
      - "docs/ci3/experiments/EXP-20260817-005/run-order-v2.json"
      - "docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2.md"
      - "docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2-evidence.json"

permissions:
  contents: write

jobs:
  materialize-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate or verify deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4b67e513f913c77e534aaf50d6b7ecae8780d7b2 HEAD
          test -z "${DOLPHIN_CI3_BLOCK_PROFILE_PATH:-}"
          python3 -m py_compile Tools/ci3/exp005/freeze_fixture_manifest.py
          rm -rf Tools/ci3/exp005/__pycache__
          if test -f docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2-evidence.json; then
            python3 Tools/ci3/exp005/freeze_fixture_manifest.py --check
            echo 'freeze outputs already materialized'
            exit 0
          fi
          python3 Tools/ci3/exp005/freeze_fixture_manifest.py --write
          python3 Tools/ci3/exp005/freeze_fixture_manifest.py --check
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'docs/ci3/experiments/EXP-20260817-005/fixture-manifest-v2.json',
              'docs/ci3/experiments/EXP-20260817-005/run-order-v2.json',
              'docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2.md',
              'docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2-evidence.json',
          }
          actual = {line[3:] for line in subprocess.check_output(
              ['git', 'status', '--porcelain=v1'], text=True
          ).splitlines() if line}
          if actual != expected:
              raise SystemExit(f'unexpected materialization scope: missing={sorted(expected-actual)}, extra={sorted(actual-expected)}')
          PY
          git config user.name 'Parm-1'
          git config user.email '75600769+Parm-1@users.noreply.github.com'
          git add -- \
            docs/ci3/experiments/EXP-20260817-005/fixture-manifest-v2.json \
            docs/ci3/experiments/EXP-20260817-005/run-order-v2.json \
            docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2.md \
            docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2-evidence.json
          git commit -m 'CI3: freeze EXP-005 fixtures and paired run order v2'
          git push origin HEAD:${{ github.head_ref }}
