name: CI3 Connector Trigger Probe

on:
  push:
    branches:
      - master
    paths:
      - ".ci3/connector-trigger-probe"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Record successful connector-triggered execution
        shell: bash
        run: |
          mkdir -p .ci3
          printf 'trigger_commit=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .ci3/connector-trigger-result
          git config user.name 'Parm-1'
          git config user.email '75600769+Parm-1@users.noreply.github.com'
          git add .ci3/connector-trigger-result
          git commit -m 'CI3: record connector-trigger probe result'
          git push origin HEAD:master
