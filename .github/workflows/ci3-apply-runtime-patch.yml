name: CI3 Apply Runtime Patch

on:
  push:
    branches:
      - ci3/block-profile-runtime-v1
    paths:
      - ".github/workflows/ci3-apply-runtime-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out runtime branch
        uses: actions/checkout@v7
        with:
          ref: ci3/block-profile-runtime-v1
          fetch-depth: 0

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          cat > /tmp/ci3-runtime-patch.b64 <<'PAYLOAD'

          PAYLOAD
          base64 -d /tmp/ci3-runtime-patch.b64 > /tmp/ci3-runtime-patch.tar.gz
          printf '%s  %s\n' '79fb4f7055f5a26a1b782f31101a9668b4024f34ce17c588c976d630b2815db8' '/tmp/ci3-runtime-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ci3-runtime-patch.tar.gz -C .
          rm -f .github/workflows/ci3-export-runtime-sources.yml
          rm -f .github/workflows/ci3-apply-runtime-patch.yml

      - name: Verify scope and publish
        shell: bash
        run: |
          git status --short
          git diff --check
          git config user.name 'Parm-1'
          git config user.email '75600769+Parm-1@users.noreply.github.com'
          git add \
            .github/workflows/ci3-powerpc-differential.yml \
            .github/workflows/ci3-export-runtime-sources.yml \
            .github/workflows/ci3-apply-runtime-patch.yml \
            Source/Core/Core/CMakeLists.txt \
            Source/Core/Core/PowerPC/CachedInterpreter/CachedInterpreter.cpp \
            Source/Core/Core/PowerPC/CachedInterpreter/CachedInterpreter.h \
            Source/Core/Core/PowerPC/CI3/BlockProfileRuntime.cpp \
            Source/Core/Core/PowerPC/CI3/BlockProfileRuntime.h \
            Source/UnitTests/Core/CMakeLists.txt \
            Source/UnitTests/Core/PowerPC/CI3BlockProfileRuntimeTest.cpp \
            docs/ci3/experiments/EXP-20260817-004/runtime-v1.md
          git commit -m 'CI3: integrate opt-in aggregate block profiler' -m 'Add an environment-gated Cached Interpreter collector, explicit orderly-shutdown JSON flush, tested output lifecycle, and three-target CI coverage. The disabled path allocates no profiler and creates no output file. No execution backend or performance claim is introduced.'
          git push origin HEAD:ci3/block-profile-runtime-v1
