name: CI3 Apply Runtime Integration Direct

on:
  pull_request:
    paths:
      - ".github/workflows/ci3-apply-runtime-direct.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ci3/block-profile-runtime-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out runtime branch
        uses: actions/checkout@v7
        with:
          ref: ci3/block-profile-runtime-v1
          fetch-depth: 0

      - name: Generate reviewed integration
        shell: bash
        run: |
          python3 Tools/ci3/exp004/apply_runtime_integration.py
          git checkout HEAD -- .github/workflows

      - name: Validate source scope and publish
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess

          allowed = {
              'Source/Core/Core/CMakeLists.txt',
              'Source/Core/Core/PowerPC/CachedInterpreter/CachedInterpreter.cpp',
              'Source/Core/Core/PowerPC/CachedInterpreter/CachedInterpreter.h',
              'Source/Core/Core/PowerPC/CI3/BlockProfileRuntime.cpp',
              'Source/Core/Core/PowerPC/CI3/BlockProfileRuntime.h',
              'Source/UnitTests/Core/CMakeLists.txt',
              'Source/UnitTests/Core/PowerPC/CI3BlockProfileRuntimeTest.cpp',
              'Tools/ci3/exp004/apply_runtime_integration.py',
              'docs/ci3/experiments/EXP-20260817-004/runtime-v1.md',
          }
          output = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True)
          actual = {line[3:] for line in output.splitlines() if line}
          if actual != allowed:
              raise SystemExit(f'unexpected worktree scope: {sorted(actual ^ allowed)}')
          print(output, end='')
          PY
          git config user.name 'Parm-1'
          git config user.email '75600769+Parm-1@users.noreply.github.com'
          git add -A -- \
            Source/Core/Core/CMakeLists.txt \
            Source/Core/Core/PowerPC/CachedInterpreter/CachedInterpreter.cpp \
            Source/Core/Core/PowerPC/CachedInterpreter/CachedInterpreter.h \
            Source/Core/Core/PowerPC/CI3/BlockProfileRuntime.cpp \
            Source/Core/Core/PowerPC/CI3/BlockProfileRuntime.h \
            Source/UnitTests/Core/CMakeLists.txt \
            Source/UnitTests/Core/PowerPC/CI3BlockProfileRuntimeTest.cpp \
            Tools/ci3/exp004/apply_runtime_integration.py \
            docs/ci3/experiments/EXP-20260817-004/runtime-v1.md
          git commit \
            -m 'CI3: integrate opt-in aggregate block profiler' \
            -m 'Add environment-gated Cached Interpreter collection, explicit orderly-shutdown JSON flush, and output-lifecycle tests. The disabled path allocates no profiler and creates no file. Workflow cleanup and validation wiring are applied separately by the connected GitHub app.'
          git push origin HEAD:ci3/block-profile-runtime-v1
