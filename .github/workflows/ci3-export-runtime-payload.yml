name: CI3 Export Runtime Payload

on:
  pull_request:
    paths:
      - ".github/workflows/ci3-export-runtime-payload.yml"
  push:
    branches:
      - ci3/block-profile-runtime-v1
    paths:
      - ".github/workflows/ci3-export-runtime-payload.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: ci3-runtime-payload-carrier
          path: .github/workflows/ci3-apply-runtime-patch.yml
          if-no-files-found: error
          retention-days: 1
