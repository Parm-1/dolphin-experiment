name: CI3 Generate EXP-005 Fixture Freeze v2

on:
  push:
    branches:
      - ci3/exp005-freeze-fixtures-v2
    paths:
      - ".github/workflows/ci3-exp005-generate-freeze-v2.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out generation branch
        uses: actions/checkout@v7
        with:
          ref: ci3/exp005-freeze-fixtures-v2
          fetch-depth: 0

      - name: Generate and verify frozen outputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4b67e513f913c77e534aaf50d6b7ecae8780d7b2 HEAD
          test -z "${DOLPHIN_CI3_BLOCK_PROFILE_PATH:-}"
          python3 -m py_compile Tools/ci3/exp005/freeze_fixture_manifest.py
          python3 Tools/ci3/exp005/freeze_fixture_manifest.py --write
          python3 Tools/ci3/exp005/freeze_fixture_manifest.py --check
          rm .github/workflows/ci3-exp005-generate-freeze-v2.yml

      - name: Publish only the deterministic freeze
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/ci3-exp005-generate-freeze-v2.yml',
              'docs/ci3/experiments/EXP-20260817-005/fixture-manifest-v2.json',
              'docs/ci3/experiments/EXP-20260817-005/run-order-v2.json',
              'docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2.md',
              'docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2-evidence.json',
          }
          actual = {line[3:] for line in subprocess.check_output(
              ['git', 'status', '--porcelain=v1'], text=True
          ).splitlines() if line}
          if actual != expected:
              raise SystemExit(f'unexpected generation scope: missing={sorted(expected-actual)}, extra={sorted(actual-expected)}')
          PY
          git config user.name 'Parm-1'
          git config user.email '75600769+Parm-1@users.noreply.github.com'
          git add -A -- \
            .github/workflows/ci3-exp005-generate-freeze-v2.yml \
            docs/ci3/experiments/EXP-20260817-005/fixture-manifest-v2.json \
            docs/ci3/experiments/EXP-20260817-005/run-order-v2.json \
            docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2.md \
            docs/ci3/experiments/EXP-20260817-005/fixture-freeze-v2-evidence.json
          git commit -m 'CI3: freeze EXP-005 fixtures and paired run order v2'
          git push origin HEAD:ci3/exp005-freeze-fixtures-v2
